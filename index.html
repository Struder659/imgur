<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Imgur Image Generator</title>
    <link rel="preconnect" href="https://i.imgur.com">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Фиксировать фон */
        }
.container {
    max-width: 1200px;
    margin: 20px auto; /* Центрируем контейнер по горизонтали */
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            grid-gap: 10px;
        }
        .image-grid img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        .image-grid img:hover {
            opacity: 0.8;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            position: relative;
        }
.imgur-link {
    position: absolute;
    top: 10px; /* Расположить ссылку снизу контейнера изображения */
    left: 10px; /* Расположить ссылку справа контейнера изображения */
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    background-color: rgba(0, 0, 0, 0.5);
    padding: 5px 10px;
    border-radius: 5px;
}

.img-container {
    max-width: 90%; /* Максимальная ширина контейнера - 90% */
    max-height: 90%; /* Максимальная высота контейнера - 90% */
    margin: auto; /* Центрируем контейнер с изображением */
    overflow: hidden; /* Скрыть части изображения, выходящие за границы контейнера */
    position: relative; /* Устанавливаем позиционирование контейнера */
}

.img-container img {
    width: 100%; /* Ширина изображения равна ширине контейнера */
    height: 100%; /* Высота изображения равна высоте контейнера */
    object-fit: contain; /* Масштабируем изображение, чтобы оно целиком помещалось в контейнер */
}



        .image-card { position: relative; min-width: 0; align-self: start; }
        .image-card:not(.loaded) img { opacity: 0; }
        .download-button {
            position: absolute;
            right: 8px;
            bottom: 8px;
            padding: 6px 9px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font: 12px Arial, sans-serif;
            cursor: pointer;
        }
        .download-button:hover, .download-button:focus-visible { background: rgba(0, 0, 0, 0.65); }
        .download-button:disabled { cursor: wait; }
        .image-card:not(.loaded) .download-button { visibility: hidden; }
        .img-container img { display: block; width: auto; height: auto; max-width: 90vw; max-height: 90vh; }
        .download-status {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            max-width: 90vw; padding: 10px 16px; border-radius: 5px;
            background: rgba(0, 0, 0, 0.85); color: white; z-index: 10000;
        }
        .download-status:empty { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-grid" id="imageGrid">
            <!-- Images will be inserted here dynamically -->
        </div>
    </div>

    <div class="download-status" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
</body>
</html>
