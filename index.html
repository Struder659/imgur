<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Random Imgur Image Generator</title>
    <link rel="preconnect" href="https://i.imgur.com">
    <link rel="stylesheet" href="styles.css?v=space-2">
</head>
<body>
    <main class="container" id="gallery">
        <div class="image-grid" id="imageGrid"></div>
    </main>

    <div class="space-viewport" id="spaceViewport" role="region" tabindex="0"
         aria-label="Поле изображений. Мышь — движение камеры, колесо — масштаб, нажатие колеса — пауза. Стрелки — движение."
         aria-hidden="true" inert>
        <div class="space-world" id="spaceWorld"></div>
    </div>

    <nav class="space-controls" aria-label="Режим просмотра">
        <button class="space-toggle" id="spaceToggle" type="button" aria-pressed="false"
                aria-controls="spaceViewport" title="Открыть пространство изображений">Space</button>
        <button class="camera-pause" id="cameraPause" type="button" hidden aria-pressed="false"
                aria-label="Приостановить камеру" title="Приостановить камеру (нажатие колеса мыши)">
            <svg class="pause-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
            <svg class="play-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
        </button>
    </nav>

    <div class="download-status" role="status" aria-live="polite"></div>
    <script src="space.js?v=space-1" defer></script>
    <script src="app.js?v=space-1" defer></script>
</body>
</html>
